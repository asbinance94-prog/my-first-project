<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رادار أسماء العتيبي — أخبار الذكاء الاصطناعي</title>
<meta name="theme-color" content="#FAF7F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#FAF7F1;
  --surface:#FFFFFF;
  --surface-2:#FBF2E0;
  --line:#E8DECB;
  --line-soft:#F1E9DA;
  --paper:#201A13;
  --dim:#584E43;
  --dimmer:#8F8474;
  --gold:#B8860B;
  --gold-deep:#8C6A0A;
  --teal:#12805F;
  --rust:#A6402A;

  --display:'Tajawal',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;

  --pad:clamp(16px,4vw,40px);
  --r:16px;
  --r-lg:20px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 460px at 88% -8%, rgba(184,134,11,.09), transparent 60%),
    radial-gradient(900px 380px at 6% 8%, rgba(18,128,95,.05), transparent 55%),
    var(--ink);
  color:var(--paper);
  font-family:var(--body);
  font-size:15.5px;
  line-height:1.75;
  min-height:100vh;
  padding-bottom:64px;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;border-radius:4px}

/* ---------- زجاجي عام ---------- */
.glass{
  background:rgba(255,255,255,.6);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,.55);
}

/* ---------- الشريط العلوي ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(250,247,241,.72);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  backdrop-filter:blur(16px) saturate(160%);
  border-bottom:1px solid var(--line);
  padding:14px var(--pad);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand h1{
  font-family:var(--display);font-weight:900;font-size:21px;
  letter-spacing:-.01em;line-height:1.2;
  background:linear-gradient(90deg,var(--paper) 30%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .sub{
  font-family:var(--mono);font-size:10.5px;color:var(--dimmer);
  letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:2px 9px;
}
.meta{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.pulse{display:inline-flex;align-items:center;gap:6px}
.pulse i{
  width:6px;height:6px;border-radius:50%;background:var(--teal);
  box-shadow:0 0 0 0 rgba(18,128,95,.5);animation:beat 2.6s infinite;
}
@keyframes beat{
  0%{box-shadow:0 0 0 0 rgba(18,128,95,.45)}
  70%{box-shadow:0 0 0 7px rgba(18,128,95,0)}
  100%{box-shadow:0 0 0 0 rgba(18,128,95,0)}
}

/* ---------- تنبيه البيانات التجريبية ---------- */
.notice{
  margin:16px var(--pad) 0;padding:13px 16px;
  border:1px solid rgba(255,255,255,.6);
  border-inline-start:3px solid var(--gold);
  font-size:13.5px;color:#5B4A12;border-radius:var(--r);
}
.notice code{font-family:var(--mono);font-size:12px;color:var(--gold-deep)}
.notice[hidden]{display:none}

/* ---------- الأهم الآن ---------- */
.reel{padding:28px var(--pad) 8px}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dimmer);
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

.strip{
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
}

.frame{
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);
  text-align:start;overflow:hidden;
  box-shadow:0 1px 2px rgba(36,30,23,.05);
  transition:box-shadow .18s ease,transform .18s ease;
  display:flex;flex-direction:column;
}
.frame:hover{box-shadow:0 14px 32px rgba(36,30,23,.12);transform:translateY(-3px)}
.frame .hero{
  position:relative;height:120px;display:flex;align-items:center;justify-content:center;
  color:#fff;
}
.frame .hero svg{width:38px;height:38px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.18))}
.frame .rank{
  position:absolute;top:10px;inset-inline-start:10px;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  padding:4px 10px;border-radius:999px;color:#fff;
}
.frame .body{padding:15px 17px 17px;display:flex;flex-direction:column;gap:8px}
.frame h2{
  font-family:var(--display);font-weight:700;font-size:16.5px;
  line-height:1.5;letter-spacing:-.01em;
}
.frame p{font-size:13px;color:var(--dim);line-height:1.65}

/* ---------- أدوات التحكم ---------- */
.controls{
  padding:26px var(--pad) 0;display:flex;flex-direction:column;gap:12px;
}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  white-space:nowrap;padding:7px 15px;border:1px solid var(--line);
  border-radius:999px;font-size:13.5px;color:var(--dim);background:var(--surface);
  transition:all .16s ease;
}
.tab:hover{border-color:var(--gold-deep);color:var(--paper)}
.tab[aria-selected="true"]{
  background:var(--gold);border-color:var(--gold);color:#FFFBF2;font-weight:600;
}
.tab .n{font-family:var(--mono);font-size:10.5px;opacity:.75;margin-inline-start:5px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{
  flex:1;min-width:200px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;
  padding:10px 16px;color:var(--paper);font-family:var(--body);font-size:14.5px;
  box-shadow:0 1px 2px rgba(36,30,23,.03);
}
.search::placeholder{color:var(--dimmer)}
.search:focus{border-color:var(--gold-deep);outline:none}
.action{
  padding:10px 18px;border:1px solid var(--gold-deep);border-radius:999px;
  color:var(--gold-deep);font-size:13.5px;font-weight:600;background:var(--surface);
  transition:all .16s ease;white-space:nowrap;
}
.action:hover{background:var(--gold);color:#FFFBF2;border-color:var(--gold)}
.action.done{background:var(--teal);border-color:var(--teal);color:#F1FFF9}

/* ---------- الخلاصة — شبكة ---------- */
.feed{
  padding:16px var(--pad) 0;
  display:grid;align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:20px;
}
.item{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 1px 2px rgba(36,30,23,.03);
  transition:box-shadow .2s ease,transform .2s ease;
  overflow:hidden;
}
.item:hover{box-shadow:0 16px 34px rgba(36,30,23,.1);transform:translateY(-3px)}
.item.fresh{outline:2px solid rgba(184,134,11,.35);outline-offset:-1px}

/* ---------- رأس الصورة/الغلاف ---------- */
.media{
  position:relative;height:150px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;
  overflow:hidden;
}
.media svg{width:36px;height:36px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.2));opacity:.95}
.media img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
.media .time{
  position:absolute;top:10px;inset-inline-end:10px;
  font-family:var(--mono);font-size:10.5px;color:#241B0A;
  padding:4px 9px;border-radius:999px;
  background:rgba(255,255,255,.72);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.media .hot{
  position:absolute;top:10px;inset-inline-start:10px;
  font-size:10.5px;font-weight:700;color:#fff;
  padding:4px 10px;border-radius:999px;
  background:rgba(166,64,42,.85);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:4px;
}
.media .cat-tag{
  position:absolute;bottom:10px;inset-inline-start:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:#fff;
  padding:4px 10px;border-radius:999px;
  background:rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}

.card{padding:17px 18px 19px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h3{
  font-family:var(--display);font-weight:700;font-size:18px;
  line-height:1.5;letter-spacing:-.012em;color:var(--paper);
}
.card .orig{
  font-family:var(--mono);font-size:11.5px;line-height:1.55;
  color:var(--dimmer);direction:ltr;text-align:left;
  padding-inline-start:9px;
  border-inline-start:1px solid var(--line);
}
.card .sum{color:var(--dim);font-size:14.5px;line-height:1.75}
.card .sum b{color:var(--paper);font-weight:600}
.ents{display:flex;flex-wrap:wrap;gap:6px}
.ent{
  font-family:var(--mono);font-size:11px;direction:ltr;
  padding:2px 9px;border-radius:999px;
  background:rgba(184,134,11,.08);color:var(--gold-deep);
  border:1px solid rgba(184,134,11,.24);
}

.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:2px}
.chip{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);
}
.chip.cat{border-color:var(--gold-deep);color:var(--gold-deep)}
.chip.cluster{border-color:var(--teal);color:var(--teal)}
.chip.sample{border-color:var(--rust);color:var(--rust)}
.chip.review{border-color:var(--rust);color:var(--rust)}
.chip.unver{border-color:var(--rust);color:var(--rust)}
.chip.src{border:none;padding-inline:0;color:var(--dimmer)}
.chip.src a{text-decoration:none;border-bottom:1px solid var(--line)}
.chip.src a:hover{color:var(--gold-deep);border-color:var(--gold-deep)}
.chip.xlate{cursor:pointer;border-color:var(--teal);color:var(--teal);font-weight:600}
.chip.xlate:hover{background:var(--teal);color:#F1FFF9}
.chip.xlate:disabled{cursor:progress;opacity:.65}

.tab.alt{border-style:dashed}
.tab.alt[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#F1FFF9}
.tsep{width:1px;background:var(--line);margin-inline:6px;flex:none}

.angle{
  margin-top:2px;padding:12px 15px;border-radius:12px;
  background:rgba(184,134,11,.08);
  border:1px solid rgba(184,134,11,.2);
  border-inline-start:3px solid var(--gold);
  display:flex;gap:12px;align-items:flex-start;
  width:100%;text-align:start;transition:background .16s ease;
}
.angle:hover{background:rgba(184,134,11,.15)}
.angle .lbl{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:var(--gold-deep);white-space:nowrap;padding-top:4px;
}
.angle .txt{font-size:13.5px;color:#5B4A12;line-height:1.6}

.empty{
  grid-column:1/-1;
  padding:70px 20px;text-align:center;color:var(--dimmer);
}
.empty strong{display:block;font-family:var(--display);font-size:17px;color:var(--dim);margin-bottom:6px}

footer{
  margin-top:44px;padding:20px var(--pad);border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;color:var(--dimmer);
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}

@media(max-width:600px){
  .feed{grid-template-columns:1fr}
  .card{padding:16px 15px 18px}
  .card h3{font-size:17px}
  .brand h1{font-size:18px}
  .meta{font-size:10px;gap:10px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

let DATA = SAMPLE, activeCat = 'all', query = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  try{
    const r = await fetch('data/news.json', {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    if(!Array.isArray(j.items) || !j.items.length) throw new Error('فارغ');
    DATA = j;
  }catch(e){
    DATA = SAMPLE;
    $('#notice').hidden = false;
  }
  render();
}

function scored(){
  return [...DATA.items].sort((a,b)=>
    ((b.relevance||0)*2 + (b.cluster_count||1)) -
    ((a.relevance||0)*2 + (a.cluster_count||1))
  );
}

function filtered(){
  const q = query.trim().toLowerCase();
  return scored().filter(it=>{
    if(activeCat.startsWith('t:')){ if(it.track !== activeCat.slice(2)) return false; }
    else if(activeCat !== 'all' && it.category !== activeCat) return false;
    if(!q) return true;
    return ((it.title_ar||'') + ' ' + (it.summary_ar||'')).toLowerCase().includes(q);
  });
}

function renderHeader(){
  $('#today').textContent = new Intl.DateTimeFormat('ar-KW',
    {weekday:'long', day:'numeric', month:'long'}).format(new Date());
  const t = DATA.generated_at ? new Date(DATA.generated_at) : null;
  $('#lastFetch').textContent = t
    ? 'آخر سحب ' + t.toLocaleTimeString('ar-KW',{hour:'2-digit',minute:'2-digit'})
    : 'بلا سحب';
  $('#count').textContent = DATA.items.length + ' خبر';
  $('#health').textContent = DATA.health || '—';
}

function renderStrip(){
  $('#strip').innerHTML = scored().filter(i => i.track !== 'arabic' && i.track !== 'watch').slice(0,3).map((it,i)=>{
    const art = artFor(it.category);
    return `
    <button class="frame" data-goto="${esc(it.id)}">
      <div class="hero" style="background:${art.grad}">
        <span class="rank glass" style="color:#241B0A">${String(i+1).padStart(2,'0')}</span>
        ${art.icon}
      </div>
      <div class="body">
        <h2>${esc(it.title_ar)}</h2>
        <p>${esc((it.summary_ar||'').split('.')[0])}.</p>
      </div>
    </button>`;
  }).join('');
}

function renderTabs(){
  const counts = {};
  DATA.items.forEach(i => counts[i.category] = (counts[i.category]||0)+1);
  const tcounts = {};
  DATA.items.forEach(i => { if(i.track) tcounts[i.track] = (tcounts[i.track]||0)+1; });
  const catTabs = Object.entries(CATS)
    .filter(([k]) => k === 'all' || counts[k])
    .map(([k,label]) => `
      <button class="tab" role="tab" data-cat="${k}" aria-selected="${k===activeCat}">
        ${label}<span class="n">${k==='all' ? DATA.items.length : counts[k]}</span>
      </button>`).join('');
  const trackTabs = Object.entries(TRACK_TABS)
    .filter(([k]) => tcounts[k])
    .map(([k,label]) => `
      <button class="tab alt" role="tab" data-cat="t:${k}" aria-selected="${'t:'+k===activeCat}">
        ${label}<span class="n">${tcounts[k]}</span>
      </button>`).join('');
  $('#tabs').innerHTML = catTabs + (trackTabs ? '<span class="tsep"></span>' + trackTabs : '');
}

function renderFeed(){
  const list = filtered();
  if(!list.length){
    $('#feed').innerHTML = `<div class="empty"><strong>لا نتائج</strong>جرّبي تصنيفاً آخر أو كلمة أقصر.</div>`;
    return;
  }
  $('#feed').innerHTML = list.map(it=>{
    const fresh = (it.relevance||0) >= 8;
    const art = artFor(it.category);
    const srcs = (it.sources||[]).map(s =>
      `<span class="chip src"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></span>`
    ).join('');
    return `
    <article class="item ${fresh?'fresh':''}" id="${esc(it.id)}">
      <div class="media" style="background:${art.grad}">
        ${art.icon}
        ${it.image ? `<img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}
        <span class="cat-tag">${esc(CATS[it.category]||'أخرى')}</span>
        ${fresh ? `<span class="hot">🔥 عاجل</span>`:''}
        <span class="time">${esc(it.published||'--:--')}</span>
      </div>
      <div class="card">
        <h3>${esc(it.title_ar)}</h3>
        ${it.title_original ? `<div class="orig" dir="ltr">${esc(it.title_original)}</div>`:''}
        ${(it.entities||[]).length ? `<div class="ents">${it.entities.map(x=>`<span class="ent" dir="ltr">${esc(x)}</span>`).join('')}</div>`:''}
        <p class="sum">${esc(it.summary_ar)}</p>
        <div class="chips">
          <span class="chip">أثر ${esc(it.relevance ?? '؟')}/10</span>
          ${(it.cluster_count>1) ? `<span class="chip cluster">${it.cluster_count} مصادر غطّته</span>`:''}
          ${it.needs_review ? `<span class="chip review">بلا أسماء — راجعي الأصل</span>`:''}
          ${it.unverified ? `<span class="chip unver">رصد صفحة — غير مؤكد</span>`:''}
          ${DATA.sample ? `<span class="chip sample">أرشيف</span>`:''}
          <button class="chip xlate" data-xlate="${esc(it.id)}" type="button">⟲ ترجمة</button>
          ${srcs}
        </div>
        ${it.content_angle ? `
          <button class="angle" data-copy="${esc(it.content_angle)}">
            <span class="lbl">زاوية محتوى</span>
            <span class="txt">${esc(it.content_angle)}</span>
          </button>`:''}
      </div>
    </article>`;
  }).join('');
}

function render(){ renderHeader(); renderStrip(); renderTabs(); renderFeed(); }

/* ---------- الترجمة الفورية لأي مقالة ---------- */
async function translateText(text){
  if(!text || !text.trim()) return text;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 7000);
  try{
    const r = await fetch(
      `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=${encodeURIComponent(text)}`,
      {signal: controller.signal}
    );
    if(!r.ok) throw new Error('translate-failed');
    const j = await r.json();
    return j[0].map(seg => seg[0]).join('');
  } finally {
    clearTimeout(timer);
  }
}

async function toggleTranslate(btn){
  const item = btn.closest('.item');
  const h3 = item.querySelector('h3');
  const sum = item.querySelector('.sum');

  if(btn.dataset.state === 'translated'){
    h3.textContent = btn.dataset.origTitle;
    sum.textContent = btn.dataset.origSum;
    btn.textContent = '⟲ ترجمة';
    btn.dataset.state = '';
    return;
  }

  btn.dataset.origTitle = h3.textContent;
  btn.dataset.origSum = sum.textContent;
  btn.textContent = 'جارِ الترجمة…';
  btn.disabled = true;
  try{
    const [t, s] = await Promise.all([translateText(h3.textContent), translateText(sum.textContent)]);
    h3.textContent = t;
    sum.textContent = s;
    btn.textContent = '⟲ عرض الأصل';
    btn.dataset.state = 'translated';
  }catch(err){
    const link = item.querySelector('.chip.src a');
    const target = link ? link.href : location.href;
    window.open(`https://translate.google.com/translate?sl=auto&tl=ar&u=${encodeURIComponent(target)}`, '_blank', 'noopener');
    btn.textContent = '⟲ ترجمة';
  }finally{
    btn.disabled = false;
  }
}

/* ---------- التفاعل ---------- */
document.addEventListener('click', e=>{
  const tab = e.target.closest('.tab');
  if(tab){ activeCat = tab.dataset.cat; renderTabs(); renderFeed(); return; }

  const frame = e.target.closest('[data-goto]');
  if(frame){
    activeCat = 'all'; query = ''; $('#search').value = '';
    renderTabs(); renderFeed();
    document.getElementById(frame.dataset.goto)
      ?.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }

  const xbtn = e.target.closest('[data-xlate]');
  if(xbtn){ toggleTranslate(xbtn); return; }

  const angle = e.target.closest('[data-copy]');
  if(angle){ copy(angle.dataset.copy, angle, 'نُسخت'); }
});

$('#search').addEventListener('input', e=>{ query = e.target.value; renderFeed(); });

$('#copyBtn').addEventListener('click', ()=>{
  const top = filtered().slice(0,5);
  const date = new Intl.DateTimeFormat('ar-KW',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
  const body = top.map((it,i)=>
    `${i+1}. ${it.title_ar}\n${it.title_original ? '   ('+it.title_original+')\n' : ''}${it.summary_ar}\nالمصدر: ${(it.sources||[]).map(s=>s.name).join('، ')}`
  ).join('\n\n');
  copy(`موجز الذكاء الاصطناعي — ${date}\n\n${body}`, $('#copyBtn'), 'تم النسخ');
});

function copy(text, el, okLabel){
  const prev = el.textContent, cls = el.className;
  navigator.clipboard.writeText(text).then(()=>{
    if(el.id === 'copyBtn'){ el.textContent = okLabel; el.className = cls + ' done'; }
    else { el.querySelector('.lbl').textContent = okLabel; }
    setTimeout(()=>{
      if(el.id === 'copyBtn'){ el.textContent = prev; el.className = cls; }
      else { el.querySelector('.lbl').textContent = 'زاوية محتوى'; }
    }, 1600);
  }).catch(()=>{ alert('المتصفح منع النسخ. افتحي الصفحة عبر https أو انسخي يدوياً.'); });
}

load();
setInterval(load, 15 * 60 * 1000);
</script>
